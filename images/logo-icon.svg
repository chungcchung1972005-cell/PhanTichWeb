<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="alohaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B8B"/>
      <stop offset="55%" stop-color="#E0417A"/>
      <stop offset="100%" stop-color="#C22058"/>
    </linearGradient>

    <!-- Subtle Top Highlight -->
    <linearGradient id="alohaShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Golden Sparkle Accent -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>

    <!-- Lens Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#7B0F34" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#alohaBg)" filter="url(#softShadow)"/>
  
  <!-- Subtle Top Gloss Curve -->
  <path d="M 6 34 C 6 18.5 18.5 6 34 6 L 86 6 C 101.5 6 114 18.5 114 34 C 114 42 75 52 6 42 Z" fill="url(#alohaShine)"/>

  <!-- Camera Body Group -->
  <g id="camera">
    <!-- Camera Top Bar / Viewfinder / Shutter -->
    <!-- Shutter button (Left) -->
    <rect x="30" y="27" width="14" height="6" rx="3" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Flash indicator (Right) -->
    <circle cx="86" cy="38" r="4.5" fill="url(#goldAccent)"/>
    <circle cx="86" cy="38" r="2" fill="#FFFFFF"/>

    <!-- Top Viewfinder Bump -->
    <path d="M 47 31 C 47 28 50 25 54 25 L 66 25 C 70 25 73 28 73 31 L 76 34 L 44 34 Z" fill="#FFFFFF"/>

    <!-- Camera Main Body -->
    <rect x="22" y="33" width="76" height="54" rx="14" fill="#FFFFFF"/>

    <!-- Decorative Top Grip Line -->
    <rect x="22" y="44" width="76" height="3" fill="#FCE7F0"/>

    <!-- Camera Lens Outer Ring -->
    <circle cx="60" cy="62" r="23" fill="#FFF1F5" stroke="#FCE7F0" stroke-width="2"/>
    <circle cx="60" cy="62" r="18" fill="url(#alohaBg)"/>

    <!-- Camera Lens Reflections -->
    <path d="M 48 54 A 14 14 0 0 1 72 54" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Center Motif: Sweet Baby Silhouette with Love Heart -->
    <!-- Baby Face -->
    <circle cx="60" cy="61" r="7.5" fill="#FFFFFF"/>
    
    <!-- Baby Beanie / Hair curl -->
    <path d="M 54 58 C 55 53 65 53 66 58 C 64 57 56 57 54 58 Z" fill="#FFD166"/>
    <circle cx="60" cy="52" r="2" fill="#FFD166"/>

    <!-- Baby Sleeping Eyes (Smiling curves) -->
    <path d="M 56.5 61 Q 58 63 59.5 61" fill="none" stroke="#E0417A" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 60.5 61 Q 62 63 63.5 61" fill="none" stroke="#E0417A" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <circle cx="55.5" cy="63" r="1" fill="#FF8DA1"/>
    <circle cx="64.5" cy="63" r="1" fill="#FF8DA1"/>
    <!-- Smiling mouth -->
    <path d="M 59 64.5 Q 60 65.5 61 64.5" fill="none" stroke="#E0417A" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Sweet Sparkle / Star (Top Right Floating) -->
  <path d="M 97 18 Q 97 25 104 25 Q 97 25 97 32 Q 97 25 90 25 Q 97 25 97 18 Z" fill="url(#goldAccent)"/>
  
  <!-- Tiny Love Heart (Bottom Left) -->
  <path d="M 16 93 C 16 89 21 86 24 90 C 27 86 32 89 32 93 C 32 98 24 103 24 103 C 24 103 16 98 16 93 Z" fill="url(#goldAccent)" opacity="0.9" transform="scale(0.55) translate(4, 60)"/>
</svg>
