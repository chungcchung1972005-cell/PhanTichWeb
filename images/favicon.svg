<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B8B"/>
      <stop offset="100%" stop-color="#C22058"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>

  <!-- Background Icon Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)"/>

  <!-- High-contrast crisp camera body for small sizes -->
  <!-- Top button & flash -->
  <rect x="16" y="13" width="8" height="3" rx="1.5" fill="#FFFFFF"/>
  <circle cx="47" cy="19" r="2.5" fill="url(#favGold)"/>
  
  <!-- Viewfinder bump -->
  <path d="M 26 15 C 26 13.5 27.5 12 29.5 12 L 34.5 12 C 36.5 12 38 13.5 38 15 L 40 17 L 24 17 Z" fill="#FFFFFF"/>

  <!-- Camera Body -->
  <rect x="11" y="16" width="42" height="32" rx="8" fill="#FFFFFF"/>

  <!-- Outer lens -->
  <circle cx="32" cy="33" r="13" fill="#FFF1F5"/>
  <circle cx="32" cy="33" r="10" fill="url(#favBg)"/>

  <!-- Center Baby Heart Motif (Highly visible at 16-32px) -->
  <path d="M 32 28 C 30 26 26.5 27.5 26.5 30 C 26.5 33 32 37 32 37 C 32 37 37.5 33 37.5 30 C 37.5 27.5 34 26 32 28 Z" fill="#FFFFFF"/>
  
  <!-- Star accent -->
  <polygon points="53,7 54.5,11 58.5,12.5 54.5,14 53,18 51.5,14 47.5,12.5 51.5,11" fill="url(#favGold)"/>
</svg>
